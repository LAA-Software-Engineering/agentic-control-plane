name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Makefile"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "Makefile"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Go ${{ matrix.go }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows Defender real-time scanning of every temp file the suite creates — t.TempDir dirs,
      # SQLite .db files, compiled test binaries, and the Go build/module caches — is a documented
      # drag on the already-slow windows-latest runner. Register exclusion paths before the Go setup,
      # build, and test steps so none of that I/O is scanned. Best-effort: tamper protection can
      # refuse the change, which must NOT fail the job — it only forgoes the speedup.
      - name: Reduce Defender interference (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            "${{ github.workspace }}",
            $env:RUNNER_TEMP,
            $env:TEMP,
            $env:TMP,
            (Join-Path $env:LOCALAPPDATA 'go-build'),
            (Join-Path $env:USERPROFILE 'go')
          ) | Where-Object { $_ -and (Test-Path $_ -IsValid) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::could not add Defender exclusion for $p : $($_.Exception.Message)"
            }
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [[ -n "$out" ]]; then
            echo "::error::Run gofmt on:"
            echo "$out"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Build terfyn
        run: go build -v -o terfyn${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/terfyn

      - name: Policy lint strict gate (validate_ok fixture)
        shell: bash
        run: |
          ./terfyn${{ runner.os == 'Windows' && '.exe' || '' }} validate \
            --strict --no-color --project internal/cli/testdata/validate_ok

      # Run the suite exactly ONCE per OS. Coverage is only consumed on Linux (see the
      # steps below), so the coverage pass runs there; the other OSes run the plain race
      # suite. Previously every OS ran the full -race suite TWICE (plain + coverage),
      # which pushed the slow windows-latest runner past its job timeout.
      # Use bash on Windows: PowerShell misparses -coverprofile=coverage.out
      # (".out" becomes a separate argument / package path).
      - name: Unit tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          go test -v \
            -race \
            -count=1 \
            -shuffle=on \
            -timeout=10m \
            ./...

      - name: Unit tests + coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tested_packages="$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')"
          go test -v \
            -race \
            -count=1 \
            -shuffle=on \
            -timeout=10m \
            -covermode=atomic \
            -coverprofile=coverage.out \
            $tested_packages

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -n1

      - name: Upload coverage artifact
        if: runner.os == 'Linux' && matrix.go == '1.25.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-go125
          path: coverage.out
          if-no-files-found: error
