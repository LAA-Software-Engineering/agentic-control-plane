# Publish cross-compiled `terfyn` binaries for a v*.*.* tag.
#
# Triggered by pushing a tag, or manually with a semver bump (which computes and
# pushes the tag for you). Releases are deliberately NOT auto-cut on merges to
# main — a release is an explicit, human-initiated action.
#
# Binaries build with CGO_ENABLED=0 on a single runner: terfyn's SQLite driver is
# modernc.org/sqlite (pure Go), so no cgo toolchain per target is needed.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump over the latest v*.*.* tag"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, build, and publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Tag push: release exactly the tag that was pushed.
            next="$REF_NAME"
            echo "Tag push: $next"
          else
            BUMP="${INPUT_BUMP:-patch}"
            # actions/checkout does not set a git identity, and the annotated tag
            # (git tag -a below) requires one.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch --tags --force

            latest=""
            while IFS= read -r t; do
              if [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                latest="$t"
                break
              fi
            done < <(git tag -l 'v*' --sort=-v:refname)

            if [ -z "$latest" ]; then
              case "$BUMP" in
                major) next="v1.0.0" ;;
                *) next="v0.1.0" ;;
              esac
              echo "Latest stable tag: <none>"
              echo "First release ($BUMP) -> $next"
            else
              ver="${latest#v}"
              major="${ver%%.*}"
              rest="${ver#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"

              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
              esac

              next="v${major}.${minor}.${patch}"
              echo "Latest stable tag: $latest"
              echo "Bump: $BUMP -> $next"
            fi

            # A tag pushed with GITHUB_TOKEN does not start another workflow run,
            # so this cannot recurse into the tag-push trigger above.
            git tag -a "$next" -m "$next"
            git push origin "$next"
          fi

          # v1.2.3-rc.1 and friends publish as GitHub pre-releases.
          if [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Test
        run: go test ./... -count=1 -timeout=10m

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          MODULE=github.com/Terfyn/terfyn/internal/cli
          LDFLAGS="-s -w -X ${MODULE}.Version=${VERSION}"
          mkdir -p dist work/linux-amd64 work/linux-arm64 work/darwin-amd64 work/darwin-arm64 work/windows-amd64

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o work/linux-amd64/terfyn ./cmd/terfyn
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o work/linux-arm64/terfyn ./cmd/terfyn
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o work/darwin-amd64/terfyn ./cmd/terfyn
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o work/darwin-arm64/terfyn ./cmd/terfyn
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o work/windows-amd64/terfyn.exe ./cmd/terfyn

          (cd work/linux-amd64 && tar czf "../../dist/terfyn-${VERSION}-linux-amd64.tar.gz" terfyn)
          (cd work/linux-arm64 && tar czf "../../dist/terfyn-${VERSION}-linux-arm64.tar.gz" terfyn)
          (cd work/darwin-amd64 && tar czf "../../dist/terfyn-${VERSION}-darwin-amd64.tar.gz" terfyn)
          (cd work/darwin-arm64 && tar czf "../../dist/terfyn-${VERSION}-darwin-arm64.tar.gz" terfyn)
          (cd work/windows-amd64 && zip -q "../../dist/terfyn-${VERSION}-windows-amd64.zip" terfyn.exe)

          (cd dist && sha256sum *.tar.gz *.zip | tee SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
