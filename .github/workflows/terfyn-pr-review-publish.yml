# Manual publish: run terfyn with --approve so a real PR comment is posted.
# Separate from terfyn-pr-review.yml so pull_request runs do not list a skipped publish job.
# See docs/GITHUB_ACTIONS.md

name: Agentic PR review (publish)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner (org or user)
        required: true
        type: string
      repo:
        description: Repository name
        required: true
        type: string
      number:
        description: Pull request number
        required: true
        type: string

concurrency:
  group: terfyn-pr-publish-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TERFYN_INSTALL: go-build
  TERFYN_VERSION: v0.1.9
  AGENTIC_PROJECT: examples/pr-review-github-actions
  AGENTIC_STATE: ${{ github.workspace }}/.agentic/ci-pr-publish.db
  AGENTIC_CACHE_STATE: "false"

jobs:
  publish-comment:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TERFYN_INSTALL
        run: |
          set -euo pipefail
          case "${TERFYN_INSTALL:-go-build}" in
            go-build|release) ;;
            *) echo "TERFYN_INSTALL must be 'go-build' or 'release', got '${TERFYN_INSTALL}'" >&2; exit 1 ;;
          esac

      - name: Cache SQLite state (optional)
        if: env.AGENTIC_CACHE_STATE == 'true'
        uses: actions/cache@v4
        with:
          path: .agentic/ci-pr-publish.db
          key: ${{ runner.os }}-agentic-pr-publish-${{ hashFiles('examples/pr-review-github-actions/**/*.yaml', 'examples/pr-review-github-actions/**/*.agent', 'examples/pr-review-github-actions/project.yaml') }}

      - name: Set up Go (build terfyn from checkout)
        if: env.TERFYN_INSTALL == 'go-build'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install terfyn (go build from checkout)
        if: env.TERFYN_INSTALL == 'go-build'
        run: |
          set -euo pipefail
          go build -o /tmp/terfyn ./cmd/terfyn
          sudo install -m 0755 /tmp/terfyn /usr/local/bin/terfyn
          terfyn version

      - name: Install terfyn (release tarball)
        if: env.TERFYN_INSTALL == 'release'
        run: |
          set -euo pipefail
          version="${TERFYN_VERSION}"
          asset="terfyn-${version}-linux-amd64.tar.gz"
          url="https://github.com/LAA-Software-Engineering/terfyn/releases/download/${version}/${asset}"
          curl -fsSL "$url" -o /tmp/terfyn.tgz
          tar -xzf /tmp/terfyn.tgz -C /tmp
          if [[ ! -x /tmp/terfyn ]]; then
            echo "Release tarball did not extract ./terfyn to /tmp (layout may have changed). Contents:" >&2
            tar -tzf /tmp/terfyn.tgz | head -n 50 >&2 || true
            exit 1
          fi
          sudo install -m 0755 /tmp/terfyn /usr/local/bin/terfyn
          terfyn version

      - name: Build workflow input
        run: |
          set -euo pipefail
          jq -n \
            --arg owner "${{ inputs.owner }}" \
            --arg repo "${{ inputs.repo }}" \
            --arg num "${{ inputs.number }}" \
            '{owner: $owner, repo: $repo, number: ($num | tonumber)}' > /tmp/pr-input.json

      - name: Validate / plan / apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERFYN_AUTO_APPROVE: "1"
        run: |
          set -euo pipefail
          terfyn validate --project "$AGENTIC_PROJECT" --no-color
          terfyn plan --project "$AGENTIC_PROJECT" --state "$AGENTIC_STATE"
          terfyn apply --project "$AGENTIC_PROJECT" --state "$AGENTIC_STATE"

      - name: Run with approved comment post
        id: publish_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          terfyn run workflow/pr-review-github \
            --project "$AGENTIC_PROJECT" \
            --state "$AGENTIC_STATE" \
            --input-file /tmp/pr-input.json \
            --approve tool.github.pull_request.post_comment \
            -o json > /tmp/publish-run-meta.json
          ec=$?
          set -e
          exit "$ec"

      - name: Job summary (publish run)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rid=""
          if [[ -f /tmp/publish-run-meta.json ]]; then
            rid="$(jq -r '.runId // empty' /tmp/publish-run-meta.json)"
          fi
          {
            echo "## Agentic PR review (publish)"
            echo ""
            echo "| Field | Value |"
            echo "|------|--------|"
            echo "| Step outcome | \`${{ steps.publish_run.outcome }}\` |"
            echo "| Run ID | \`$rid\` |"
            echo ""
            if [[ -n "$rid" ]]; then
              echo "### Trace (truncated)"
              echo ""
              echo '```text'
              terfyn logs --project "$AGENTIC_PROJECT" --state "$AGENTIC_STATE" --run "$rid" 2>/dev/null | head -n 200 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
