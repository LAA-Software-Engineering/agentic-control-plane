apiVersion: agentic.dev/v0
kind: Tool
metadata:
  name: github
spec:
  type: native
  safety:
    trusted: true
    sideEffects: false
  operations:
    read_pr:
      effects: [github.read]
    post_comment:
      effects: [github.write, external.visible]
    merge_pr:
      effects: [github.write, destructive]
