apiVersion: agentic.dev/v0
kind: Project
metadata:
  name: agent-quickstart
spec:
  # .agent sources (main.agent) are discovered automatically; only YAML
  # resources are imported.
  imports:
    - ./policies/default.yaml
    - ./tools/notes.yaml
  defaults:
    policy: default
    model: mock/gpt-4
    runtime: local
  providers:
    models:
      mock:
        type: mock
