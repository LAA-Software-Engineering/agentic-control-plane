apiVersion: agentic.dev/v0
kind: Policy
metadata:
  name: coding-agent
spec:
  execution:
    maxWallClockSeconds: 300
    maxTotalCostUsd: 5
  # The Implementer may read, write, and run tests in the workspace.
  effects:
    permit:
      - workspace.read
      - workspace.write
      - process.exec
