apiVersion: agentic.dev/v0
kind: Workflow
metadata:
  name: handoff
spec:
  description: |
    Offline demo: a triager agent looks up context, then a fixer agent applies a mock
    patch. The first agent's structured output is interpolated into the second step.
    Each agent has its own tools and policy. The mock write is trusted and not in
    requiredFor, so the run succeeds without HITL or --approve.
  policy: apply-fix
  input:
    schema: ./schemas/ticket-input.json
  steps:
    - id: triager
      agent: triager
      with:
        ticket: ${input.ticket}
    - id: fixer
      agent: fixer
      with:
        ticket: ${input.ticket}
        diagnosis: ${steps.triager.output.summary}
        findings: ${steps.triager.output.findings}
  output:
    value:
      triage: ${steps.triager.output}
      fix: ${steps.fixer.output}
