apiVersion: agentic.dev/v0
kind: Agent
metadata:
  name: burner
spec:
  model: mock/gpt-4
  policy: tight-budget
  tools:
    - helper
  constraints:
    timeoutSeconds: 60
    maxIterations: 8
  instructions: |
    You have a helper tool. Call it once if it is available, then respond with one JSON
    object only (no markdown, no code fences):
    {"summary": "<one line>"}
  output:
    schema: ./schemas/status-output.json
