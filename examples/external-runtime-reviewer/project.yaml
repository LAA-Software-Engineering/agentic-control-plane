apiVersion: agentic.dev/v0
kind: Project
metadata:
  name: external-runtime-reviewer
spec:
  imports:
    - ./policies/reviewer.yaml
    - ./tools/workspace.yaml
  defaults:
    model: mock/gpt-4
    policy: reviewer
    # The default runtime is the built-in local engine. The same program runs under the
    # external Claude Code agent with `terfyn run --runtime claude-code` — the authority
    # bound is identical either way (see README).
    runtime: local
  providers:
    models:
      mock:
        type: mock
