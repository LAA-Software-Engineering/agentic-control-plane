apiVersion: agentic.dev/v0
kind: Policy
metadata:
  name: reviewer
spec:
  execution:
    maxWallClockSeconds: 300
    maxTotalCostUsd: 5
  # The Reviewer may read and run tests, but NOT write — workspace.write is absent from the
  # permit set, so even if a grant tried to reach it the effect would be denied.
  effects:
    permit:
      - workspace.read
      - process.exec
