apiVersion: agentic.dev/v0
kind: Project
metadata:
  name: env-overlays
spec:
  imports:
    - ./policies/default.yaml
    - ./tools/notify.yaml
    - ./agents/reviewer.yaml
    - ./workflows/review.yaml
    - ./environments/dev.yaml
    - ./environments/staging.yaml
    - ./environments/prod.yaml
  defaults:
    policy: default
    model: mock/gpt-4
    runtime: local
  providers:
    models:
      mock:
        type: mock
      openai:
        type: openai
        apiKeyFrom: env:OPENAI_API_KEY
