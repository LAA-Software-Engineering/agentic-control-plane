apiVersion: agentic.dev/v0
kind: Environment
metadata:
  name: prod
spec:
  overrides:
    agents:
      reviewer:
        model: openai/gpt-4o
        constraints:
          timeoutSeconds: 30
          requireStructuredOutput: true
    policies:
      default:
        execution:
          maxTotalCostUsd: 1
          maxWallClockSeconds: 60
          requireStructuredOutput: true
        approvals:
          requiredFor:
            - tool.notify.default
